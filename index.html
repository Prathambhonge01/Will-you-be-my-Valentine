<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💖</title>
    <meta name="description" content="An interactive, animated, and super cute Valentine's Day proposal website!">
    
    <!-- Open Graph for sharing on iMessage, WhatsApp, Instagram, etc. -->
    <meta property="og:title" content="Will You Be My Valentine? 💖">
    <meta property="og:description" content="I have a very special question to ask you... Click to see! 💕">
    <meta property="og:image" content="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExbW5lenZyZHI5OXM2eW95b3pmMG40cWVrMDhtNjVuM3A4dGNxa2g2dSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/VM1fcpu2bKs1e2Kdbj/giphy.gif">

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
</head>
<body>

    <!-- Ambient particle canvases -->
    <canvas id="hearts-canvas"></canvas>
    <canvas id="confetti-canvas"></canvas>

    <!-- Top utility buttons -->
    <div class="top-bar">
        <button id="music-btn" class="icon-btn" onclick="toggleAudio()" title="Toggle Sweet Music">
            🎵 <span>Music</span>
        </button>
        <button class="icon-btn" onclick="openModal()" title="Create custom share link">
            ✨ <span>Personalize</span>
        </button>
    </div>

    <!-- Main Card -->
    <main class="container">
        <div class="badge">💘 Valentine's Special</div>
        <h1 id="headline">Will you be my Valentine?</h1>
        <div id="from-container" class="from-text" style="display: none;"></div>

        <div class="gif_container">
            <img id="main-gif" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExbW5lenZyZHI5OXM2eW95b3pmMG40cWVrMDhtNjVuM3A4dGNxa2g2dSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/VM1fcpu2bKs1e2Kdbj/giphy.gif" alt="Cute Valentine Bear asking">
        </div>

        <div class="buttons-area">
            <button class="yes-button" onclick="handleYesClick()">
                Yes! 💖
            </button>
            <button class="no-button" onclick="handleNoClick()">
                No 🥺
            </button>
        </div>

        <p class="hint-text">Choose carefully... there is only one right answer! 😉</p>
    </main>

    <!-- Personalize Modal -->
    <div id="personalize-modal" class="modal-overlay" onclick="if(event.target === this) closeModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Personalize Your Ask 💕</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <p style="font-size: 0.9rem; color: #800f2f; margin-bottom: 14px;">
                Add names to make this proposal uniquely yours, then send the link!
            </p>
            <div class="form-group">
                <label for="to-name-input">Their Name (Valentine)</label>
                <input type="text" id="to-name-input" placeholder="e.g. Sarah, Pookie, Sweetheart...">
            </div>
            <div class="form-group">
                <label for="from-name-input">Your Name</label>
                <input type="text" id="from-name-input" placeholder="e.g. Alex, Your Secret Admirer...">
            </div>
            <button class="generate-btn" onclick="generateShareLink()">Generate Custom Link 🔗</button>

            <div id="share-result" class="share-result">
                <label style="font-size: 0.8rem; font-weight: bold; color: #590d22; display: block; margin-bottom: 4px;">Your Shareable Link:</label>
                <input type="text" id="share-link-input" class="share-link-input" readonly>
                <button id="copy-btn" class="copy-btn" onclick="copyShareLink()">Copy Link 📋</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
